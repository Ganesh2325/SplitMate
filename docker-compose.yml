services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_ENGINE: postgres
      POSTGRES_HOST: db
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: splitmate
      POSTGRES_USER: splitmate
      POSTGRES_PASSWORD: splitmate
    ports:
      - "5432:5432"
    volumes:
      - splitmate-postgres:/var/lib/postgresql/data

volumes:
  splitmate-postgres:
