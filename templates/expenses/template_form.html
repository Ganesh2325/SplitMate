{% extends "base.html" %}
{% block title %}New template · SplitMate{% endblock %}
{% block content %}
<div class="panel p-4" style="max-width: 640px;">
  <h1 class="h3">Save an expense template</h1>
  <form method="post">{% csrf_token %}
    <label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" name="name" required>
    <label class="form-label" for="description">Description</label><input class="form-control mb-3" id="description" name="description">
    <label class="form-label" for="amount">Usual amount</label><input class="form-control mb-3" id="amount" name="amount" inputmode="decimal">
    <label class="form-label" for="split_method">Split method</label>
    <select class="form-select mb-3" id="split_method" name="split_method"><option value="equal">Equal</option><option value="exact">Exact</option><option value="percent">Percentage</option><option value="shares">Shares</option><option value="itemized">Itemized</option></select>
    <label class="form-label" for="notes">Notes</label><textarea class="form-control mb-3" id="notes" name="notes"></textarea>
    <button class="btn btn-forest" type="submit">Save template</button>
  </form>
</div>
{% endblock %}
