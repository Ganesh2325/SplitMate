{% extends "base.html" %}
{% block title %}New budget · SplitMate{% endblock %}
{% block content %}
<div class="panel p-4" style="max-width: 680px;"><h1 class="h3">New budget</h1>
<form method="post">{% csrf_token %}
  <label class="form-label" for="name">Name</label><input class="form-control mb-3" id="name" name="name" required>
  <label class="form-label" for="scope">Scope</label><select class="form-select mb-3" id="scope" name="scope"><option value="personal">Personal shares</option><option value="group">Group expense totals</option></select>
  <label class="form-label" for="group">Group</label><select class="form-select mb-3" id="group" name="group"><option value="">None</option>{% for group in groups %}<option value="{{ group.id }}">{{ group.name }}</option>{% endfor %}</select>
  <label class="form-label" for="category">Category</label><select class="form-select mb-3" id="category" name="category"><option value="">All categories</option>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select>
  <label class="form-label" for="limit_amount">Limit</label><input class="form-control mb-3" id="limit_amount" name="limit_amount" required inputmode="decimal">
  <label class="form-label" for="currency">Currency</label><select class="form-select mb-3" id="currency" name="currency">{% for value, label in currencies %}<option value="{{ value }}" {% if value == user.preferred_currency %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
  <label class="form-label" for="period">Period</label><select class="form-select mb-3" id="period" name="period"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="yearly">Yearly</option><option value="custom">Custom</option></select>
  <label class="form-label" for="start_date">Start</label><input class="form-control mb-3" id="start_date" type="date" name="start_date" value="{{ today|date:'Y-m-d' }}" required>
  <label class="form-label" for="end_date">End, for a custom period</label><input class="form-control mb-3" id="end_date" type="date" name="end_date">
  <button class="btn btn-forest" type="submit">Save budget</button>
</form>
</div>
{% endblock %}
